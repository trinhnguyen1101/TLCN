name: air-quality-lakehouse

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  image: air-quality-airflow:2.10.5
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - lakehouse-net
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse-net
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    restart: "no"
    # The image entrypoint prefixes commands with `airflow`; override it so the
    # initialization shell script below is executed as Bash instead.
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        airflow db migrate
        airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Local --lastname Admin --role Admin --email "$${AIRFLOW_ADMIN_EMAIL}" || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\""]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse-net
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./scripts/init-minio.sh:/scripts/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    networks:
      - lakehouse-net
    restart: "no"

  nessie:
    image: ghcr.io/projectnessie/nessie:0.104.5
    # Docker creates a new named volume as root. Nessie's default non-root user
    # cannot initialize RocksDB there on Docker Desktop.
    user: "0:0"
    environment:
      NESSIE_VERSION_STORE_TYPE: ROCKSDB
      NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /var/lib/nessie
    ports:
      - "${NESSIE_PORT}:19120"
    volumes:
      - nessie-data:/var/lib/nessie
    healthcheck:
      # The Nessie image provides curl, not wget.
      test: ["CMD-SHELL", "curl -fsS http://localhost:19120/api/v2/config >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - lakehouse-net
    restart: unless-stopped

  spark-master:
    build:
      context: ./docker/spark
    image: air-quality-spark:3.5.4-iceberg-1.7.1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "7077:7077"
    volumes:
      - ./spark/jobs:/opt/spark/work-dir/jobs:ro
      - ./spark/config:/opt/spark/conf:ro
      - ./spark/jars:/opt/spark/custom-jars
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse-net
    restart: unless-stopped

  spark-worker:
    build:
      context: ./docker/spark
    image: air-quality-spark:3.5.4-iceberg-1.7.1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    volumes:
      - ./spark/jobs:/opt/spark/work-dir/jobs:ro
      - ./spark/config:/opt/spark/conf:ro
      - ./spark/jars:/opt/spark/custom-jars
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - lakehouse-net
    restart: unless-stopped

  trino:
    image: trinodb/trino:476
    ports:
      - "${TRINO_PORT}:8080"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/v1/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks:
      - lakehouse-net
    restart: unless-stopped

networks:
  lakehouse-net:
    name: lakehouse-net
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  nessie-data:
