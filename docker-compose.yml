name: air-quality-lakehouse

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  image: air-quality-airflow:2.10.5
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: "true"
    AWS_CONNECTION_STRING: ${AWS_CONNECTION_STRING}
    AWS_SECRET_KEY: ${AWS_SECRET_KEY}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    DOCKER_HOST: tcp://docker-proxy:2375
    AIRFLOW_SUPABASE_START_DATE: ${AIRFLOW_SUPABASE_START_DATE:-2026-10-27}
    AIRFLOW_SUPABASE_MAX_MISSING_HOURS: ${AIRFLOW_SUPABASE_MAX_MISSING_HOURS:-1}
    SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:-}
    SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:-}
    SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:-}
    SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:-}
    SUPABASE_S3_BUCKET: ${SUPABASE_S3_BUCKET:-raw-api}
    RCLONE_TRANSFERS: ${RCLONE_TRANSFERS:-8}
    RCLONE_CHECKERS: ${RCLONE_CHECKERS:-16}
    RCLONE_RETRIES: ${RCLONE_RETRIES:-5}
    RCLONE_LOW_LEVEL_RETRIES: ${RCLONE_LOW_LEVEL_RETRIES:-10}
    RCLONE_CONNECT_TIMEOUT: ${RCLONE_CONNECT_TIMEOUT:-15s}
    RCLONE_IO_TIMEOUT: ${RCLONE_IO_TIMEOUT:-5m}
    LAKEHOUSE_SPARK_IMAGE: air-quality-spark:3.5.4-iceberg-1.7.1
    LAKEHOUSE_RCLONE_IMAGE: rclone/rclone:1.75.2
    LAKEHOUSE_DATA_USER: ${LAKEHOUSE_DATA_USER:-1000:1000}
    LAKEHOUSE_DOCKER_API_VERSION: "1.45"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    # These named bind volumes are also mounted by DockerOperator Spark tasks.
    # Referencing them here guarantees Compose creates them before a DAG runs.
    - airflow-spark-jobs:/opt/airflow/lakehouse-mounts/jobs:ro
    - airflow-spark-config:/opt/airflow/lakehouse-mounts/spark-config:ro
    - airflow-silver-definition:/opt/airflow/lakehouse-mounts/silver:ro
    - airflow-gold-definition:/opt/airflow/lakehouse-mounts/gold:ro
    - airflow-landing-data:/opt/airflow/lakehouse-mounts/landing:ro
    - airflow-supabase-sync:/opt/airflow/lakehouse-mounts/supabase-sync:ro
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - lakehouse-net
    - docker-api-net
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse-net
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    restart: "no"
    # The image entrypoint prefixes commands with `airflow`; override it so the
    # initialization shell script below is executed as Bash instead.
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        airflow db migrate
        airflow pools set bronze_sync 2 "Parallel immutable Bronze ingestion"
        airflow pools set iceberg_writer 1 "Single Iceberg writer across Lakehouse DAGs"
        airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Local --lastname Admin --role Admin --email "$${AIRFLOW_ADMIN_EMAIL}" || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\""]
      interval: 30s
      timeout: 10s
      retries: 5

  # Airflow's DockerOperator launches the already verified Spark image for each
  # task. Keep the Docker API off the main application network. POST access is
  # still privileged and is appropriate only for this trusted local stack.
  docker-proxy:
    build:
      context: ./docker/docker-proxy
    image: air-quality-docker-socket-proxy:0.5.0-long-wait
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api-net
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r protocol status rest <&3 &&
          [ "$$status" = "200" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse-net
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./scripts/init-minio.sh:/scripts/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    networks:
      - lakehouse-net
    restart: "no"

  nessie:
    image: ghcr.io/projectnessie/nessie:0.104.5
    # Docker creates a new named volume as root. Nessie's default non-root user
    # cannot initialize RocksDB there on Docker Desktop.
    user: "0:0"
    environment:
      NESSIE_VERSION_STORE_TYPE: ROCKSDB
      NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /var/lib/nessie
    ports:
      - "${NESSIE_PORT}:19120"
    volumes:
      - nessie-data:/var/lib/nessie
    healthcheck:
      # The Nessie image provides curl, not wget.
      test: ["CMD-SHELL", "curl -fsS http://localhost:19120/api/v2/config >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - lakehouse-net
    restart: unless-stopped

  spark-master:
    build:
      context: ./docker/spark
    image: air-quality-spark:3.5.4-iceberg-1.7.1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_CONNECTION_STRING: ${AWS_CONNECTION_STRING}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "7077:7077"
    volumes:
      - ./spark/jobs:/opt/spark/work-dir/jobs:ro
      - ./lakehouse/silver:/opt/spark/work-dir/lakehouse/silver:ro
      - ./lakehouse/gold:/opt/spark/work-dir/lakehouse/gold:ro
      - ./data/landing:/opt/spark/work-dir/landing:ro
      - ./data/supabase-sync:/opt/spark/work-dir/supabase-sync:ro
      - ./spark/config:/opt/spark/conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse-net
    restart: unless-stopped

  spark-worker:
    build:
      context: ./docker/spark
    image: air-quality-spark:3.5.4-iceberg-1.7.1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_CONNECTION_STRING: ${AWS_CONNECTION_STRING}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    volumes:
      - ./spark/jobs:/opt/spark/work-dir/jobs:ro
      - ./lakehouse/silver:/opt/spark/work-dir/lakehouse/silver:ro
      - ./lakehouse/gold:/opt/spark/work-dir/lakehouse/gold:ro
      - ./data/landing:/opt/spark/work-dir/landing:ro
      - ./data/supabase-sync:/opt/spark/work-dir/supabase-sync:ro
      - ./spark/config:/opt/spark/conf:ro
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - lakehouse-net
    restart: unless-stopped

  trino:
    image: trinodb/trino:476
    ports:
      - "${TRINO_PORT}:8080"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /v1/info HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r protocol status rest <&3 &&
          [ "$$status" = "200" ]
      interval: 15s
      timeout: 5s
      retries: 12
    networks:
      - lakehouse-net
    restart: unless-stopped

networks:
  lakehouse-net:
    name: lakehouse-net
    driver: bridge
  docker-api-net:
    name: lakehouse-docker-api-net
    driver: bridge
    internal: true

volumes:
  postgres-data:
  minio-data:
  nessie-data:
  airflow-spark-jobs:
    name: air-quality-airflow-spark-jobs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/spark/jobs
  airflow-spark-config:
    name: air-quality-airflow-spark-config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/spark/config
  airflow-silver-definition:
    name: air-quality-airflow-silver-definition
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/lakehouse/silver
  airflow-gold-definition:
    name: air-quality-airflow-gold-definition
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/lakehouse/gold
  airflow-landing-data:
    name: air-quality-airflow-landing-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/landing
  airflow-supabase-sync:
    name: air-quality-airflow-supabase-sync
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/supabase-sync
